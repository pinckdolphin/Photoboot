<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Frame Photo Booth</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="booth-container">
    <h1>📸 Custom Frame Photo Booth</h1>

    <!-- Frame Selector -->
    <div class="controls">
      <label for="frame-select">Choose Frame Style:</label>
      <select id="frame-select">
        <option value="#ffffff">Classic White</option>
        <option value="#1a1a1a">Dark Mode</option>
        <option value="#ffb6c1">Pastel Pink</option>
        <option value="#87ceeb">Sky Blue</option>
      </select>
      <button id="snap-btn">Start Photo Strip (3 Snaps)</button>
    </div>

    <!-- Live Preview -->
    <div class="viewfinder-container">
      <video id="webcam" autoplay playsinline></video>
      <div id="timer" class="hidden">3</div>
    </div>

    <!-- Final Output -->
    <div class="result-container">
      <h3>Your Photo Strip:</h3>
      <canvas id="photo-strip"></canvas>
      <br>
      <a id="download-btn" class="hidden" download="photo-strip.png">Download Photo Strip</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
